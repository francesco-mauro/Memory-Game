<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Il classico gioco del Memory in JavaScript: trova tutte le coppie con meno mosse possibile.">
    <title>Memory-Game</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%232e3d49'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <h1>Gioco del Memory</h1>

    <div class="stats">
        <p>Mosse: <span id="move-counter">0</span></p>
        <p>Tempo: <span id="timer">0</span> secondi</p>
        <p>Record: <span id="record">nessuno</span></p>
        <button type="button" id="restart">Ricomincia</button>
    </div>

    <div id="game-board" role="group" aria-label="Tabellone"></div>

    <p id="announcer" class="visually-hidden" aria-live="polite"></p>

    <div id="win-message" hidden>
        <h2>Complimenti! Hai completato il gioco.</h2>
        <p>Tempo impiegato: <span id="final-time"></span> secondi</p>
        <p>Mosse effettuate: <span id="final-moves"></span></p>
        <p id="new-record" hidden>Nuovo record!</p>
        <button type="button" id="play-again">Gioca ancora</button>
    </div>

    <script src="script/logic.js"></script>
    <script src="script/script.js"></script>
</body>
</html>
